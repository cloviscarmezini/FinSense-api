version: "3.9"

services:
  # 1. API Principal FinSense
  finsense-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finsense-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - ENVIRONMENT=local
      - DATABASE_URL=postgres://finsense:finsense_secret@finsense-db:5432/finsense_db?sslmode=disable
      - JWT_SECRET=finsense_super_secret_jwt_key_local_development_2026_xyz
      - JWT_ACCESS_EXPIRATION_MINUTES=15
      - JWT_REFRESH_EXPIRATION_DAYS=30
      - S3_ENDPOINT=http://finsense-storage:9000
      - S3_PUBLIC_URL=http://localhost:9000
      - S3_BUCKET=finsense-assets
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_REGION=us-east-1
      - AI_MANAGER_URL=http://finsense-ai-manager:8082
      - AI_ENGINE_URL=http://finsense-ai:8000
      - MODELS_DIR=/app/models
      - SWAGGER_ENABLED=true
    volumes:
      - ./models:/app/models
    depends_on:
      finsense-db:
        condition: service_healthy
      finsense-storage:
        condition: service_healthy
      finsense-ai-manager:
        condition: service_started
    networks:
      - finsense-network

  # 2. Banco de Dados PostgreSQL 16
  finsense-db:
    image: postgres:16-alpine
    container_name: finsense-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=finsense
      - POSTGRES_PASSWORD=finsense_secret
      - POSTGRES_DB=finsense_db
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finsense -d finsense_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - finsense-network

  # 3. Object Storage S3-Compatível (MinIO)
  finsense-storage:
    image: cgr.dev/chainguard/minio:latest-dev
    container_name: finsense-storage
    user: "0:0"
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - finsense-network

  # 4. Inicializador do Bucket MinIO
  finsense-storage-init:
    image: cgr.dev/chainguard/minio-client:latest-dev
    container_name: finsense-storage-init
    depends_on:
      finsense-storage:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://finsense-storage:9000 minioadmin minioadmin; do
        echo 'Aguardando MinIO storage inicializar...';
        sleep 1;
      done;
      mc mb --ignore-existing local/finsense-assets;
      mc anonymous set download local/finsense-assets;
      exit 0;
      "
    networks:
      - finsense-network

  # 5. Microserviço Dedicado de Gestão de Modelos de IA (Admin Dashboard Web em :8082)
  finsense-ai-manager:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finsense-ai-manager
    restart: unless-stopped
    entrypoint: ["/app/finsense-ai-manager"]
    ports:
      - "8082:8082"
    environment:
      - ADMIN_PORT=8082
      - ENVIRONMENT=local
      - DATABASE_URL=postgres://finsense:finsense_secret@finsense-db:5432/finsense_db?sslmode=disable
      - MODELS_DIR=/app/models
      - AI_ENGINE_URL=http://finsense-ai:8000
      - ADMIN_API_KEY=finsense_admin_secret_key_2026
    volumes:
      - ./models:/app/models
      - ./web:/app/web
    depends_on:
      finsense-db:
        condition: service_healthy
    networks:
      - finsense-network

  # 6. Servidor de Inferência de IA (llama.cpp server para GGUF)
  # Observação: requer que ao menos um modelo .gguf tenha sido baixado em ./models
  finsense-ai:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: finsense-ai
    profiles:
      - ai
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - ./models:/models
    command: >
      --host 0.0.0.0 --port 8000
      --ctx-size 4096 --n-gpu-layers 0
    networks:
      - finsense-network

  # 7. Swagger UI Autônomo
  finsense-swagger-ui:
    image: swaggerapi/swagger-ui:latest
    container_name: finsense-swagger-ui
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      - URL=http://localhost:8080/api/v1/openapi.json
    depends_on:
      - finsense-api
    networks:
      - finsense-network

volumes:
  pgdata:
    driver: local
  miniodata:
    driver: local

networks:
  finsense-network:
    driver: bridge
